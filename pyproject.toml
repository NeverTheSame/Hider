[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hider"
version = "0.2.0"
description = "Tiered redaction library that strips secrets and personal data from log bundles and JSON exports"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kirill Kuklin"}]
keywords = ["redaction", "pii", "secrets", "log-sanitization", "privacy", "pseudonymisation", "data-protection"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Intended Audience :: Developers",
]
requires-python = ">=3.11"
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Tier 2, alternate backend: local pretrained NER over the free-text residue,
# selected with --tier2 spacy. The default --tier2 classifier backend needs
# nothing beyond scikit-learn above. See requirements-ner.txt.
ner = [
    "spacy>=3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
# Tier 3: an LLM pass over the residue, selected with --tier3 openai.
llm = ["openai>=1.0"]

[project.scripts]
hider = "hider.cli:main"

[tool.setuptools]
packages = ["hider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
