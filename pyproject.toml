[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hider"
version = "0.2.0"
description = "Tiered redaction gateway for support log bundles on their way to an LLM provider"
requires-python = ">=3.11"
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Tier 2: local NER over the free-text residue. See requirements-ner.txt.
ner = [
    "spacy>=3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
hider = "hider.cli:main"

[tool.setuptools]
packages = ["hider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
